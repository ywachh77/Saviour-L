name: fusion-nightly

# Standalone nightly walk-forward mirror (23:55 UTC).

on:
  schedule:
    - cron: "55 23 * * *"
  workflow_dispatch:

concurrency:
  group: fusion-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate the bot directory
        id: locate
        run: |
          if [ -d eurusd-proxy-bot/fusion ]; then
            echo "dir=eurusd-proxy-bot" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Walk-forward, promote or roll back
        env:
          RUNNER: github-actions
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_KEY_1: ${{ secrets.TWELVE_DATA_KEY_1 }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          TWELVE_DATA_KEY_3: ${{ secrets.TWELVE_DATA_KEY_3 }}
          TWELVE_DATA_KEY_4: ${{ secrets.TWELVE_DATA_KEY_4 }}
          TWELVE_DATA_KEY_5: ${{ secrets.TWELVE_DATA_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SIGNAL_HORIZON_MINUTES: "15"
          ADAPTIVE_HORIZON: "1"
          MAX_HORIZON_MINUTES: "120"
          MIN_ATR_TO_SPREAD_RATIO: "1.4"
          CANDLE_HISTORY: "750"
          PAIRS: "EUR/USD,BTC/USD,ETH/USD"
          MTF_FILTER: "1"
          MTF_MINUTES: "15"
          MTF_MIN_GAP_BPS: "2.0"
          MTF_MACRO_FILTER: "1"
          MTF_MACRO_MIN_GAP_BPS: "1.5"
          NEWS_FILTER: "1"
          SIGNAL_COOLDOWN_MINUTES: "15"
          LOSS_GUARD_STREAK: "3"
          LOSS_GUARD_SHADOW_RECOVERY: "1"
          FX_ROLLOVER_GUARD: "1"
          NEEDLE_ENABLED: "1"
          NEEDLE_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python3 scripts/nightly.py
