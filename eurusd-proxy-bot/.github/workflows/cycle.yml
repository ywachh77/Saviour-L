name: fusion-cycle

# Standalone workflow mirror (becomes active when eurusd-proxy-bot/ is exported
# as its own repository via scripts/publish_repo.sh).

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "55 23 * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: fusion-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate the bot directory
        id: locate
        run: |
          if [ -d eurusd-proxy-bot/fusion ]; then
            echo "dir=eurusd-proxy-bot" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Run one cycle
        env:
          RUNNER: github-actions
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_KEY_1: ${{ secrets.TWELVE_DATA_KEY_1 }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          TWELVE_DATA_KEY_3: ${{ secrets.TWELVE_DATA_KEY_3 }}
          TWELVE_DATA_KEY_4: ${{ secrets.TWELVE_DATA_KEY_4 }}
          TWELVE_DATA_KEY_5: ${{ secrets.TWELVE_DATA_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          ADAPTIVE_HORIZON: "1"
          MAX_HORIZON_MINUTES: "120"
          PAIRS: "EUR/USD,BTC/USD,ETH/USD"
          MTF_FILTER: "1"
          MTF_MINUTES: "15"
          NEWS_FILTER: "1"
          LISTEN_SECONDS: "720"
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python3 scripts/actions_cycle.py
