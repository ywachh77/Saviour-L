name: fusion-tests

# The honesty charter is enforced here. If a change makes synthetic data train
# the model, lets a late signal be backdated, or stops charging costs, these
# tests fail and the commit should not be merged.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the suite
        run: |
          cd eurusd-proxy-bot
          python -m unittest discover -s tests -t .

      - name: Offline smoke run
        run: |
          cd eurusd-proxy-bot
          python scripts/smoke.py 420
