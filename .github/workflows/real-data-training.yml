# Real-Data Training Pipeline
#
# Automates the full training cycle on a schedule:
#   1. Fetch real candles from Supabase (EUR/USD, BTC/USD, ETH/USD)
#   2. Train GBDT ensemble models on real candle data
#   3. Run walk-forward backtest
#   4. Upload artifacts + commit summary report
#
# This complements fusion-nightly.yml (which does walk-forward via the bot's
# own system). This workflow uses the standalone train_real_model.py +
# backtest_engine.py pipeline for research and monitoring.
#
# The repo is public, so Actions minutes are free. The daily cadence is a
# good balance: fresh enough to capture regime changes, cheap enough to run
# indefinitely.

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      pairs:
        description: "Comma-separated pairs to process"
        required: false
        default: "EUR/USD,BTC/USD,ETH/USD"
      candles:
        description: "Number of candles per pair"
        required: false
        default: "2000"
  push:
    branches: ["main"]
    paths:
      - "eurusd-proxy-bot/scripts/run_training_pipeline.py"
      - "eurusd-proxy-bot/scripts/train_real_model.py"
      - "eurusd-proxy-bot/scripts/backtest_engine.py"
      - "eurusd-proxy-bot/fusion/features.py"
      - "eurusd-proxy-bot/fusion/custom_indicators.py"
      - ".github/workflows/real-data-training.yml"

concurrency:
  group: real-data-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: eurusd-proxy-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: eurusd-proxy-bot/requirements*.txt

      - name: Install dependencies
        run: |
          pip install requests python-dotenv
          # Install project deps if requirements exist
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run training pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          PAIRS="${{ github.event.inputs.pairs || 'EUR/USD,BTC/USD,ETH/USD' }}"
          CANDLESTICK_COUNT="${{ github.event.inputs.candles || '2000' }}"
          python3 scripts/run_training_pipeline.py --pairs "$PAIRS" --candles "$CANDLESTICK_COUNT"

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-models-${{ github.run_id }}
          path: |
            eurusd-proxy-bot/var/real_candles/EURUSD/ensemble_model*.json
            eurusd-proxy-bot/var/real_candles/EURUSD/training_report.json
            eurusd-proxy-bot/var/real_candles/EURUSD/backtest_report.json
            eurusd-proxy-bot/var/real_candles/BTCUSD/ensemble_model*.json
            eurusd-proxy-bot/var/real_candles/BTCUSD/training_report.json
            eurusd-proxy-bot/var/real_candles/BTCUSD/backtest_report.json
            eurusd-proxy-bot/var/real_candles/ETHUSD/ensemble_model*.json
            eurusd-proxy-bot/var/real_candles/ETHUSD/training_report.json
            eurusd-proxy-bot/var/real_candles/ETHUSD/backtest_report.json
            eurusd-proxy-bot/var/real_candles/pipeline_summary.json
          retention-days: 30

      - name: Generate and commit summary report
        if: always()
        run: |
          mkdir -p reports
          SUMMARY_FILE="eurusd-proxy-bot/var/real_candles/pipeline_summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            cp "$SUMMARY_FILE" reports/pipeline_summary.json
            # Also copy individual training reports
            for pair_dir in EURUSD BTCUSD ETHUSD; do
              for report in training_report.json backtest_report.json; do
                if [ -f "eurusd-proxy-bot/var/real_candles/$pair_dir/$report" ]; then
                  mkdir -p "reports/$pair_dir"
                  cp "eurusd-proxy-bot/var/real_candles/$pair_dir/$report" "reports/$pair_dir/$report"
                fi
              done
            done
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Commit reports (not candle files — they're in .gitignore and regenerated)
          git add reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "chore: daily training pipeline results [skip ci]"
            git push origin HEAD
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Training pipeline failed. Check the logs above."
          echo "::error::Artifacts uploaded — check the Actions tab for model files."
