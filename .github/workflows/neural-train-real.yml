name: neural-train-real

# Fetch real EUR/USD M1 candles from Supabase and train the neural model.
# This replaces synthetic-data training with live Supabase candles.
# The fetch script pulls real candles; the neural operations trainer
# trains the Temporal Transformer on them.

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 3 AM UTC — after fetch-supabase-candles
  workflow_dispatch:
    inputs:
      candles:
        description: "Path to candle JSON file"
        required: false
        default: "var/real_candles/eurusd_real_20261030.json"

concurrency:
  group: neural-train-real
  cancel-in-progress: false

jobs:
  train-neural:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: eurusd-proxy-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: eurusd-proxy-bot/requirements*.txt

      - name: Install dependencies
        run: |
          pip install requests python-dotenv torch
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Fetch real candles from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 scripts/fetch_supabase_candles.py

      - name: Convert batch files to JSON
        run: |
          python3 scripts/convert_candles.py

      - name: Verify real candles exist
        run: |
          python3 -c "
          import json, os
          path = 'var/real_candles/eurusd_real_20261030.json'
          if not os.path.exists(path):
              print('ERROR: No candle file found at', path)
              exit(1)
          d = json.load(open(path))
          print(f'Candle file: {path}')
          print(f'Candles: {len(d)}')
          if len(d) < 500:
              print(f'WARNING: Only {len(d)} candles — training may be insufficient')
          # Check if volume is non-zero (real data indicator)
          vols = [r.get('v', 0) for r in d]
          real_vol = sum(1 for v in vols if v > 0)
          print(f'Non-zero volume candles: {real_vol}/{len(d)}')
          if real_vol == 0:
              print('WARNING: All volumes are zero — data may be synthetic')
          "

      - name: Train neural model on real candles
        env:
          PYTHONPATH: eurusd-proxy-bot
        run: |
          python3 -m fusion.neural.operations --mode train --candles var/real_candles/eurusd_real_20261030.json

      - name: Commit new checkpoint
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add checkpoints (neural/ is gitignored in eurusd-proxy-bot)
          git add -f eurusd-proxy-bot/neural/checkpoints/
          git add -f eurusd-proxy-bot/var/real_candles/

          if git diff --staged --quiet; then
            echo "No checkpoint changes to commit"
          else
            git commit -m "chore: neural training on real Supabase candles [skip ci]"
            git push origin HEAD
          fi

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-checkpoint-${{ github.run_id }}
          path: eurusd-proxy-bot/neural/checkpoints/
          retention-days: 90
