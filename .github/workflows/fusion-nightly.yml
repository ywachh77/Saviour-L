name: fusion-nightly

# The training run: walk-forward, promote or roll back, refit calibration.
#
# At the repository root on purpose: GitHub only discovers workflows in
# <root>/.github/workflows/. The copy inside eurusd-proxy-bot/.github/ never
# fires.
#
# Separate from fusion-cycle for two reasons. It needs a much longer timeout --
# walk-forward over months of EUR/USD bars is
# minutes of work, not seconds -- and it should not be in the path that
# produces signals. The cycle job also calls the nightly when one of its runs
# lands in the window, but job slots mean whichever gets there first wins and
# the other stands down, so running both is safe.
#
# Every market/strategy environment flag MUST match fusion-cycle.yml so the
# walk-forward replay judges the exact system that runs in production.

on:
  schedule:
    - cron: "55 23 * * *"
  workflow_dispatch:

concurrency:
  group: fusion-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: eurusd-proxy-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Walk-forward, promote or roll back
        env:
          RUNNER: github-actions
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_KEY_1: ${{ secrets.TWELVE_DATA_KEY_1 }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          TWELVE_DATA_KEY_3: ${{ secrets.TWELVE_DATA_KEY_3 }}
          TWELVE_DATA_KEY_4: ${{ secrets.TWELVE_DATA_KEY_4 }}
          TWELVE_DATA_KEY_5: ${{ secrets.TWELVE_DATA_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          SIGNAL_HORIZON_MINUTES: "30"
          ADAPTIVE_HORIZON: "1"
          MAX_HORIZON_MINUTES: "120"
          MIN_ATR_TO_SPREAD_RATIO: "0.8"
          SURESHOT_CONFIDENCE_THRESHOLD: "0.80"
          CANDLE_HISTORY: "750"
          PAIRS: "EUR/USD"
          MTF_FILTER: "1"
          MTF_MINUTES: "15"
          MTF_MIN_GAP_BPS: "1.0"
          MTF_MACRO_FILTER: "1"
          MTF_MACRO_MIN_GAP_BPS: "0.3"
          NEWS_FILTER: "1"
          SIGNAL_COOLDOWN_MINUTES: "15"
          LOSS_GUARD_STREAK: "3"
          LOSS_GUARD_SHADOW_RECOVERY: "1"
          FX_ROLLOVER_GUARD: "1"
          MAX_UNCERTAINTY: "0.05"
          MIN_CONFLUENCE_CHECKS: "5"
          NEEDLE_ENABLED: "1"
          NEEDLE_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
          # Self-learning module parameters
          TARGET_WIN_RATE: "0.95"
          LOSS_LEARNING_MULTIPLIER: "2.0"
          LOSS_LEARNING_RATE_CAP: "0.08"
          PAPER_TRADING_MAX_TRADES: "80"
          LOSS_FOCUSED_RETRAIN_ENABLED: "1"
          MIN_TRADE_CONFIDENCE: "0.15"
          # System version
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          GIT_COMMIT: ${{ github.sha }}
        run: python3 scripts/nightly.py
