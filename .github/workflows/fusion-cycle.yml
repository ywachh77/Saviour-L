name: fusion-cycle

# The runner. Wakes on a cron, does one cycle, disappears.
#
# This file lives at the repository ROOT on purpose. GitHub only discovers
# workflows in <root>/.github/workflows/ -- the copies inside
# eurusd-proxy-bot/.github/ are invisible to it and never fire. While an
# always-on device was the primary runner that did not matter; with Actions as
# the only runner it means the bot silently does nothing at all.
#
# The eurusd-proxy-bot/ copies stay for scripts/publish_repo.sh, which pushes
# that folder as its own standalone repository.
#
# CADENCE AND THE COST OF WAITING
#
# This repository is PUBLIC, and GitHub does not bill Actions minutes for Linux
# runners on public repositories. That is what makes a five-minute wake-up
# affordable here; the arithmetic below is the private-repo case, kept only
# because it is the reason the previous default was thirty minutes.
#
#     */15   ~2,880 runs/mo  ~36,000 min   free while public
#     */30   ~1,440 runs/mo   ~2,200 min   what a private repo would allow
#
# If this repo ever goes private, cut the listening window and move to "*/30",
# or the account will be billed. Nothing else needs editing.
#
# THE CADENCE IS */15, NOT */5, BECAUSE GITHUB DROPS */5.
#
# This was measured, not assumed. With "*/5 * * * *" deployed, the cycle did
# not run once in forty minutes -- not delayed, absent. GitHub throttles very
# frequent schedules and does not guarantee cron at all: the */30 schedule it
# replaced averaged fifteen to twenty minutes between runs, and GitHub itself
# warns that scheduled runs are best-effort during busy periods.
#
# So the wake-ups are kept rare and made long instead. Each run listens for
# LISTEN_SECONDS, which covers most of the interval, and the gap between one
# container stopping and the next starting is what a command has to survive.
# Rare-and-long beats frequent-and-dropped, because a dropped run is a window
# with no bot in it at all.
#
# The two extra entries exist because the nightly (23:55) and the digest (00:05)
# fall on minutes a half-hourly cron never lands on. They are cheap -- two runs
# a day -- and the runner tolerates a late start, so even if GitHub queues them
# the job still fires.
#
# Cadence also caps how often a signal can be emitted: the bot evaluates the
# minute it wakes into and never backdates, so */30 means at most 48 evaluated
# minutes a day. That is a research cadence, not a latency-critical one, which
# is what this bot is for.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "55 23 * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: fusion-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # A ceiling, not an expectation: an ordinary run finishes in about four
    # minutes (a cycle plus the LISTEN_SECONDS window). It has to stay high
    # enough for the 23:55 entry, which picks up the nightly and trains on
    # real history -- that one takes minutes. Job slots mean only one runner
    # does it, whichever gets there first.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eurusd-proxy-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore tuned Needle 3 .cact cache (optional)
        id: needle-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            eurusd-proxy-bot/var/needle/saviour_needle3.cact
            eurusd-proxy-bot/var/needle/finetune_report.json
            ~/.cache/needle
          key: saviour-needle3-${{ runner.os }}-${{ hashFiles('eurusd-proxy-bot/data/needle_saviour_train.jsonl', 'eurusd-proxy-bot/fusion/needle_agent.py') }}
          restore-keys: |
            saviour-needle3-${{ runner.os }}-

      - name: Install lightweight Needle 3 runtime client when .cact is cached
        if: steps.needle-cache.outputs.cache-hit != ''
        continue-on-error: true
        run: pip install -q -r requirements-needle.txt

      - name: Run one cycle
        env:
          RUNNER: github-actions
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_KEY_1: ${{ secrets.TWELVE_DATA_KEY_1 }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          TWELVE_DATA_KEY_3: ${{ secrets.TWELVE_DATA_KEY_3 }}
          TWELVE_DATA_KEY_4: ${{ secrets.TWELVE_DATA_KEY_4 }}
          TWELVE_DATA_KEY_5: ${{ secrets.TWELVE_DATA_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          # Stretch each hold to a length that can cover its own cost instead
          # of trading a fixed five minutes. At the volatility actually measured
          # from live EUR/USD candles, five minutes projects about 1.3 pips
          # against a 1.2 pip round turn, which needs a 97% hit rate to break
          # even. Without this the bot takes trades that cannot win by
          # construction, and more accuracy does not fix that.
          SIGNAL_HORIZON_MINUTES: "30"
          ADAPTIVE_HORIZON: "1"
          MAX_HORIZON_MINUTES: "120"
          MIN_ATR_TO_SPREAD_RATIO: "1.4"
          CANDLE_HISTORY: "750"
          # Trade EUR/USD alongside 24/7 spot crypto (BTC/USD, ETH/USD) so
          # weekends and FX off-hours evaluate instruments whose spread-to-ATR
          # ratio is 14-20x lower than one-minute FX.
          PAIRS: "EUR/USD,BTC/USD,ETH/USD"
          # Validated on 101,730 real EUR/USD M1 candles (Aug-Oct 2026) plus
          # 506,630 real MT5 EUR/USD M1 bars (2025-2026) and 83,088 live BTC/ETH
          # M1 bars: 5m/15m/60m cascade + anti-climax pullback/reversal gating.
          MTF_FILTER: "1"
          MTF_MINUTES: "15"
          MTF_MIN_GAP_BPS: "2.0"
          MTF_MACRO_FILTER: "1"
          MTF_MACRO_MIN_GAP_BPS: "1.5"
          NEWS_FILTER: "1"
          SIGNAL_COOLDOWN_MINUTES: "15"
          LOSS_GUARD_STREAK: "3"
          LOSS_GUARD_SHADOW_RECOVERY: "1"
          FX_ROLLOVER_GUARD: "1"
          NEEDLE_ENABLED: "1"
          NEEDLE_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
          # Hold the Telegram connection open after the cycle so commands are
          # answered while the container still exists. Twelve minutes of a
          # fifteen-minute interval leaves a gap of about two minutes, which is
          # what a command sent at the worst moment has to wait. Keep this plus
          # startup under both the cron interval and the job timeout.
          LISTEN_SECONDS: "720"
        run: python3 scripts/actions_cycle.py
