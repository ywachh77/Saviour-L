name: fusion-cycle

# The runner. Wakes on a cron, does one cycle, disappears.
#
# This file lives at the repository ROOT on purpose. GitHub only discovers
# workflows in <root>/.github/workflows/ -- the copies inside
# eurusd-proxy-bot/.github/ are invisible to it and never fire. While an
# always-on device was the primary runner that did not matter; with Actions as
# the only runner it means the bot silently does nothing at all.
#
# The eurusd-proxy-bot/ copies stay for scripts/publish_repo.sh, which pushes
# that folder as its own standalone repository.
#
# CADENCE AND THE COST OF WAITING
#
# This repository is PUBLIC, and GitHub does not bill Actions minutes for Linux
# runners on public repositories. That is what makes a five-minute wake-up
# affordable here; the arithmetic below is the private-repo case, kept only
# because it is the reason the previous default was thirty minutes.
#
#     */5    ~8,640 runs/mo   ~13,000 min   free while public
#     */30   ~1,440 runs/mo   ~2,200 min    what a private repo would allow
#
# If this repo ever goes private, switch the cron back to "*/30 * * * *" or the
# account will be billed. Nothing else needs editing.
#
# Each run also long-polls Telegram for LISTEN_SECONDS after the cycle, so a
# command sent while the container is alive is answered within about a second.
# The worst case is a command sent during the gap between runs, which waits for
# the next wake-up -- roughly two minutes at this cadence.
#
# The two extra entries exist because the nightly (23:55) and the digest (00:05)
# fall on minutes a half-hourly cron never lands on. They are cheap -- two runs
# a day -- and the runner tolerates a late start, so even if GitHub queues them
# the job still fires.
#
# Cadence also caps how often a signal can be emitted: the bot evaluates the
# minute it wakes into and never backdates, so */30 means at most 48 evaluated
# minutes a day. That is a research cadence, not a latency-critical one, which
# is what this bot is for.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "55 23 * * *"
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: fusion-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # A ceiling, not an expectation: an ordinary run finishes in about four
    # minutes (a cycle plus the LISTEN_SECONDS window). It has to stay high
    # enough for the 23:55 entry, which picks up the nightly and trains on
    # real history -- that one takes minutes. Job slots mean only one runner
    # does it, whichever gets there first.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eurusd-proxy-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run one cycle
        env:
          RUNNER: github-actions
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_KEY_1: ${{ secrets.TWELVE_DATA_KEY_1 }}
          TWELVE_DATA_KEY_2: ${{ secrets.TWELVE_DATA_KEY_2 }}
          TWELVE_DATA_KEY_3: ${{ secrets.TWELVE_DATA_KEY_3 }}
          TWELVE_DATA_KEY_4: ${{ secrets.TWELVE_DATA_KEY_4 }}
          TWELVE_DATA_KEY_5: ${{ secrets.TWELVE_DATA_KEY_5 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          # Stretch each hold to a length that can cover its own cost instead
          # of trading a fixed five minutes. At the volatility actually measured
          # from live EUR/USD candles, five minutes projects about 1.3 pips
          # against a 1.2 pip round turn, which needs a 97% hit rate to break
          # even. Without this the bot takes trades that cannot win by
          # construction, and more accuracy does not fix that.
          ADAPTIVE_HORIZON: "1"
          MAX_HORIZON_MINUTES: "120"
          # Hold the Telegram connection open after the cycle so commands are
          # answered while the container still exists. Keep this plus startup
          # comfortably under the cron interval and the job timeout.
          LISTEN_SECONDS: "180"
        run: python3 scripts/actions_cycle.py
